# United MFL — production stack: Postgres + Go API + Next.js site + Caddy (routing, admin SPA).
# Runs behind the host nginx, which terminates HTTPS (see nginx.conf.example).
name: unitedmfl

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: unitedmfl
      POSTGRES_USER: unitedmfl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unitedmfl -d unitedmfl"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      ADDR: ":8080"
      DATABASE_URL: postgres://unitedmfl:${POSTGRES_PASSWORD}@db:5432/unitedmfl?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ chars)}
      # uploads are returned as site-relative /uploads/... URLs (served on both site and admin)
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Bosh admin}
      POINTS_WIN: ${POINTS_WIN:-3}
      POINTS_DRAW: ${POINTS_DRAW:-1}
      POINTS_LOSS: ${POINTS_LOSS:-0}
      LINEUP_BENCH_MAX: ${LINEUP_BENCH_MAX:-9}
      # Telegram Live-pult bot; empty = disabled
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Instagram feed on /media: normally connected in the admin (Instagram page);
      # this optional token is used only if nothing is connected yet
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
      OCR_LANG: ${OCR_LANG:-eng}
      # purge the site's data cache after every admin change
      WEB_REVALIDATE_URL: http://web:3000/internal/revalidate
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?set REVALIDATE_SECRET in .env}
    volumes:
      - uploads:/data/uploads

  web:
    build:
      context: ../web
      args:
        API_INTERNAL_URL: http://api:8080
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_BASE_URL:-https://unitedmfl.com}
        NEXT_PUBLIC_GA_ID: ${GA_MEASUREMENT_ID:-}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_INTERNAL_URL: http://api:8080
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_BASE_URL:-https://unitedmfl.com}
      TICKETS_URL: ${TICKETS_URL:-}
      SHOP_URL: ${SHOP_URL:-}
      SOCIAL_INSTAGRAM: ${SOCIAL_INSTAGRAM:-}
      SOCIAL_TELEGRAM: ${SOCIAL_TELEGRAM:-}
      SOCIAL_YOUTUBE: ${SOCIAL_YOUTUBE:-}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      YANDEX_VERIFICATION: ${YANDEX_VERIFICATION:-}
      BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}

  proxy:
    build:
      context: ..
      dockerfile: deploy/proxy.Dockerfile
      args:
        VITE_SITE_URL: ${PUBLIC_BASE_URL:-https://unitedmfl.com}
    restart: unless-stopped
    depends_on:
      - api
      - web
    environment:
      # plain HTTP inside the container; TLS is terminated by the host nginx
      SITE_ADDRESS: ":80"
      ADMIN_ADDRESS: ":81"
    ports:
      # bind to localhost: the host nginx proxies the domains here.
      # For a quick test by IP set SITE_BIND=0.0.0.0:8120 / ADMIN_BIND=0.0.0.0:8121.
      - "${SITE_BIND:-127.0.0.1:8120}:80"
      - "${ADMIN_BIND:-127.0.0.1:8121}:81"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db:
  uploads:
  caddy_data:
  caddy_config:
